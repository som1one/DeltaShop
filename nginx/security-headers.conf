# Included from every block that also declares its own add_header —
# nginx drops inherited add_headers as soon as a child block adds one,
# so the set has to be repeated rather than inherited.
#
# HSTS is deliberately short to start with: raise to 31536000 once HTTPS
# has run clean for a couple of weeks, since it cannot be taken back early.
add_header Strict-Transport-Security "max-age=2592000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
