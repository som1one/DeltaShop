upstream nextjs {
    server app:3000;
}

# ── 1. HTTP — ACME challenge, everything else redirected to HTTPS ──
server {
    listen 80 default_server;
    server_name forma-visual.com www.forma-visual.com;

    # Let's Encrypt http-01: served from disk, never redirected
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://forma-visual.com$request_uri;
    }
}

# ── 2. HTTPS — www folds into the bare domain ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.forma-visual.com;

    ssl_certificate     /etc/letsencrypt/live/forma-visual.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forma-visual.com/privkey.pem;

    return 301 https://forma-visual.com$request_uri;
}

# ── 3. HTTPS — the site ──
server {
    listen 443 ssl default_server;
    http2 on;
    server_name forma-visual.com;

    ssl_certificate     /etc/letsencrypt/live/forma-visual.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forma-visual.com/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # static assets — long cache
    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # public assets
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass http://nextjs;
        expires 30d;
        access_log off;
    }

    # everything else → Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
