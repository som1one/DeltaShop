# TLS settings shared by every server block (http context).
# Mounted as conf.d/00-tls.conf so it loads before default.conf.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# ECDHE only — keeps us off DHE, so no dhparam file is needed.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Websocket-safe Connection header: "upgrade" only when the client asked.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
