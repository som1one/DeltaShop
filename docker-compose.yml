services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deltashop
      POSTGRES_USER: deltashop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltashop"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://deltashop:${POSTGRES_PASSWORD}@db:5432/deltashop
      ROBOKASSA_LOGIN: ${ROBOKASSA_LOGIN:-}
      ROBOKASSA_PASSWORD1: ${ROBOKASSA_PASSWORD1:-}
      ROBOKASSA_PASSWORD2: ${ROBOKASSA_PASSWORD2:-}
      ROBOKASSA_TEST: ${ROBOKASSA_TEST:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
